<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace équipe — Boutique Lakay</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#14161C">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&display=swap">
<link rel="stylesheet" href="ui.css">
</head>
<body>

<header>
  <div class="wrap hbar">
    <span class="mark">Boutique Lakay</span>
    <span class="tag">ÉQUIPE</span>
    <span class="spacer"></span>
    <button class="lien" id="sortir" hidden>Déconnexion</button>
  </div>
</header>

<main>
  <section id="vue-login" class="wrap">
    <div class="sechead"><h2>Espace équipe</h2></div>
    <p class="note">Connectez-vous : vous serez conduit à votre espace.</p>
    <div class="pile">
      <div class="bloc">
        <div class="champ"><label for="email">Adresse e-mail</label>
          <input id="email" type="email" autocomplete="username" inputmode="email"></div>
        <div class="champ"><label for="mdp">Mot de passe</label>
          <input id="mdp" type="password" autocomplete="current-password"></div>
        <div id="loginErr"></div>
        <button class="cta" id="entrer">Entrer</button>
      </div>
      <p class="note">Acheteur ? <a href="index.html">La boutique est par ici.</a></p>
    </div>
  </section>

  <section id="vue-choix" class="wrap" hidden>
    <div class="sechead"><h2>Votre espace</h2></div>
    <div class="pile" id="choix"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="ops.js"></script>
<script src="equipe.js"></script>
<script>
/* Porte d'entrée unique de l'équipe : une seule adresse à retenir et à
   partager. Chacun arrive sur l'écran de son rôle. Un administrateur
   voit les trois, parce qu'il a besoin de voir ce que voient ses
   agents et ses vendeurs pour les aider par téléphone. */

const ESPACES = {
  vendeur: [{ url: 'vendeur.html', nom: 'Espace vendeur',
              quoi: 'Commandes à préparer, catalogue, argent dû.' }],
  agent:   [{ url: 'agent.html', nom: 'Comptoir',
              quoi: 'Appels, embarquement, remise au client.' }],
  admin:   [{ url: 'admin.html', nom: 'Administration',
              quoi: 'Boutiques, catalogue, livraison, règlements.' },
            { url: 'agent.html', nom: 'Comptoir',
              quoi: 'Ce que voit un agent, pour l’aider au téléphone.' },
            { url: 'vendeur.html', nom: 'Espace vendeur',
              quoi: 'Ce que voit un vendeur.' }]
};

function montrerVue(v) {
  ['login', 'choix'].forEach(function (k) {
    const e = document.getElementById('vue-' + k);
    if (e) e.hidden = (k !== v);
  });
  const s = document.getElementById('sortir');
  if (s) s.hidden = (v !== 'choix');
}

async function router() {
  const role = await OPS.monRole();
  const liste = ESPACES[role];

  if (!liste) {
    document.getElementById('choix').innerHTML =
      '<div class="bloc"><p class="note">Ce compte n’appartient pas à l’équipe. ' +
      'Si vous êtes vendeur, demandez à un administrateur de vous donner le rôle.</p>' +
      '<a class="cta" href="index.html" style="display:block;text-align:center;' +
      'text-decoration:none">Aller à la boutique</a>' +
      '<button class="ghost" id="sortir2">Se déconnecter</button></div>';
    montrerVue('choix');
    return;
  }

  // Un seul espace possible : on y va directement, sans écran de choix.
  if (liste.length === 1) { location.replace(liste[0].url); return; }

  document.getElementById('choix').innerHTML = liste.map(function (e) {
    return '<a class="bloc" href="' + e.url + '" style="text-decoration:none;color:inherit">' +
      '<div class="titreligne"><h2>' + e.nom + '</h2></div>' +
      '<p class="note">' + e.quoi + '</p></a>';
  }).join('');
  montrerVue('choix');
}

document.addEventListener('click', function (ev) {
  const c = ev.target;
  if (c.id === 'entrer') {
    agir(c, 'loginErr', function () {
      return OPS.connexion(val('email'), document.getElementById('mdp').value);
    }, router);
    return;
  }
  if (c.id === 'sortir' || c.id === 'sortir2') {
    OPS.deconnexion().then(function () { location.reload(); });
  }
});

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && (ev.target.id === 'mdp' || ev.target.id === 'email')) {
    document.getElementById('entrer').click();
  }
});

(async function () {
  if (!API.pret()) {
    msg('loginErr', 'Librairie non chargée. Vérifie ta connexion et recharge.', 'ko');
    montrerVue('login');
    return;
  }
  try {
    const { data } = await API.sb().auth.getSession();
    if (data && data.session && !data.session.user.is_anonymous) { await router(); return; }
  } catch (e) {}
  montrerVue('login');
})();
</script>
</body>
</html>
